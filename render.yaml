# Render Blueprint for https://yeli.onrender.com   (Dashboard -> New -> Blueprint, pick this repository)
#
# IMPORTANT: on Render's FREE plan the filesystem is ephemeral. The SQLite database is erased every time the
# service restarts, is redeployed, or spins down after ~15 minutes without traffic. That's fine for a demo, but
# accounts, Yelis and chats will disappear. To keep your data: switch to a paid plan and uncomment the `disk`
# block and the YELI_DB variable below (persistent disks are only available on paid plans).
services:
  - type: web
    name: yeli                      # the service name decides the address: yeli.onrender.com
    runtime: python
    plan: free                      # paid plan + disk below = data survives restarts
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py     # Waitress, listening on 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: HOST
        value: 0.0.0.0              # Render's proxy must reach the app from outside the container
      - key: YELI_HTTPS
        value: "1"                  # secure cookies: the site is served over https
      - key: YELI_PROXY
        value: "1"                  # trust Render's X-Forwarded-* headers (real client IPs, https detection)
      - key: YELI_SECRET_KEY
        generateValue: true         # a stable random key, so sessions survive restarts
      - key: YELI_ADMINS
        sync: false                 # you'll be asked for it: your own username
      - key: YELI_DEMO
        value: "1"                  # shows the "data may be reset" banner. Remove it when you use a persistent disk
      # - key: YELI_DB
      #   value: /var/data/yeli.db  # with the disk below
      # - key: YELI_MEDIA_URL
      #   value: https://your-media-server.example.com   # optional, see README: MediaMTX can't run on Render
    # disk:
    #   name: yeli-data
    #   mountPath: /var/data
    #   sizeGB: 1
