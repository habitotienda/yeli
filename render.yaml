# Render Blueprint for https://yeli.onrender.com   (Dashboard -> New -> Blueprint, pick this repository)
#
# DATABASE: accounts, Yelis, chats, comments, covers and project drafts live in Supabase (DATABASE_URL below), so they
# survive restarts. The video FILES of saved streams and edits are still written to the server's disk, and on Render's
# FREE plan the disk is erased on every restart: for those, use a paid plan with the `disk` block below.
# VOICE IN THE STREAM: the bot's voice needs the speech program espeak-ng on the server. Render's Python runtime can't
# install it, so to use that feature change `runtime: python` below to `runtime: docker` (the Dockerfile installs it) and
# delete the buildCommand and startCommand lines. Without it everything works; the voice is read on each viewer's device.
services:
  - type: web
    name: yeli                      # the service name decides the address: yeli.onrender.com
    runtime: python
    plan: free                      # paid plan + disk below = data survives restarts
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py     # Waitress, listening on 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: HOST
        value: 0.0.0.0              # Render's proxy must reach the app from outside the container
      - key: YELI_HTTPS
        value: "1"                  # secure cookies: the site is served over https
      - key: YELI_PROXY
        value: "1"                  # trust Render's X-Forwarded-* headers (real client IPs, https detection)
      - key: YELI_SECRET_KEY
        generateValue: true         # a stable random key, so sessions survive restarts
      - key: YELI_ADMINS
        sync: false                 # you'll be asked for it: your own username
      - key: DATABASE_URL
        sync: false                 # you'll be asked for it: Supabase -> Connect -> Transaction pooler (port 6543)
      - key: YELI_DEMO
        value: "1"                  # shows the "data may be reset" banner (saved video files). Remove it when you use a persistent disk
      # Notification emails (the bell works without these). Render's free plan blocks SMTP, so use Resend's HTTPS API:
      # - key: YELI_PUBLIC_URL
      #   value: https://yeli.onrender.com
      # - key: YELI_MAIL_FROM
      #   value: Yeli <no-reply@your-domain.com>
      # - key: YELI_RESEND_API_KEY
      #   sync: false
      # - key: YELI_VOD_DIR
      #   value: /var/data/vods     # with the disk below
      # - key: YELI_MEDIA_URL
      #   value: https://your-media-server.example.com   # optional, see README: MediaMTX can't run on Render
    # disk:
    #   name: yeli-data
    #   mountPath: /var/data
    #   sizeGB: 1
