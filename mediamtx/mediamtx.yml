# MediaMTX configuration for Yeli (https://github.com/bluenviron/mediamtx, free and open source, MIT).
# Run:   mediamtx mediamtx/mediamtx.yml        (or:  docker compose up -d)
#
# Streamers publish with WHIP (from the Yeli studio or from OBS 30+), viewers play with WHEP.
# MediaMTX asks Yeli whether each request is allowed, so only the owner of a channel can publish to it.
#
# Not tested against a real MediaMTX in the environment this file was written in:
# the option names come from MediaMTX's documentation. If your version complains about one,
# compare with the mediamtx.yml that ships with it.

logLevel: info

# --- who may publish / read: ask Yeli -----------------------------------------------------------
authMethod: http
# If MediaMTX runs in Docker (see docker-compose.yml) this address is the host machine, as seen from the container.
authHTTPAddress: http://127.0.0.1:5000/api/media/auth   # with Docker: http://host.docker.internal:5000/api/media/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

# --- only WebRTC is needed ------------------------------------------------------------------------
rtsp: no
rtmp: no
hls: no
srt: no
api: no
metrics: no
pprof: no

webrtc: yes
webrtcAddress: :8889          # WHIP/WHEP HTTP port. Put this address in YELI_MEDIA_URL.
webrtcLocalUDPAddress: :8189  # media goes over this UDP port: open it in your router/firewall
webrtcLocalTCPAddress: :8189  # fallback for networks that block UDP

# Addresses browsers can use to reach this machine's media ports. Add your public IP or domain
# when viewers are not on the same network, e.g.  webrtcAdditionalHosts: [203.0.113.10]
webrtcAdditionalHosts: []

paths:
  all_others:
